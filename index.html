
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>確認用サイト</title>
<style>
body {
  margin: 0;
  background: #f5f6f8;
  color: #222;
  font-family: sans-serif;
}
main {
  max-width: 420px;
  margin: 60px auto;
  padding: 28px;
  background: white;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 5px 25px #0001;
}
button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: 0;
  border-radius: 9px;
  font-size: 16px;
  cursor: pointer;
}
.primary {
  background: #2878e8;
  color: white;
}
.secondary {
  background: #e9edf2;
  color: #333;
}
p { line-height: 1.8; color: #666; }
#send { display: none; }
</style>
</head>
<body>
<main>
<h1>確認用サイト</h1>
<h3>位置情報を取得してもよろしいですか？</h3>
<p>
同意すると、いろいろ起こります。
</p>

<button class="primary" id="agree">同意する</button>
<button class="secondary" id="decline">同意しない</button>

<p id="status">選択してください。</p>

<button class="primary" id="send">
この位置情報を送信する
</button>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const db = window.supabase.createClient(
  APP_CONFIG.url,
  APP_CONFIG.anonKey
);

const status = document.getElementById("status");
const sendButton = document.getElementById("send");

let positionData = null;

document.getElementById("agree").onclick = () => {
  positionData = null;
  sendButton.style.display = "none";

  status.textContent = "位置情報を確認しています...";

  navigator.geolocation.getCurrentPosition(
    position => {
      positionData = position.coords;

      status.textContent =
        "位置情報を取得しました。送信する場合は下のボタンを押してください。";

      sendButton.style.display = "block";
    },
    () => {
      status.textContent =
        "位置情報を取得できませんでした。";
    }
  );
};

document.getElementById("decline").onclick = () => {
  positionData = null;
  sendButton.style.display = "none";
  status.textContent = "同意しなかったため取得しません。";
};

sendButton.onclick = async () => {
  if (!positionData) return;

  sendButton.disabled = true;
  status.textContent = "送信しています...";

  const { error } = await db
    .from("locations")
    .insert({
      latitude: positionData.latitude,
      longitude: positionData.longitude,
      accuracy: positionData.accuracy,
      consented_at: new Date().toISOString()
    });

  if (error) {
    status.textContent =
      "送信できませんでした。設定を確認してください。";
    sendButton.disabled = false;
    return;
  }

  positionData = null;
  sendButton.style.display = "none";
  status.textContent = "送信が完了しました。ありがとうございます。";
};
</script>
</body>
</html>
