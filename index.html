
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>確認用サイト</title>
<style>
body {
  margin: 0;
  background: #f5f6f8;
  color: #222;
  font-family: sans-serif;
}
main {
  max-width: 420px;
  margin: 70px auto;
  padding: 30px;
  background: white;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 5px 25px #0001;
}
button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 9px;
  font-size: 16px;
  cursor: pointer;
}
#agree {
  background: #2878e8;
  color: white;
}
#decline {
  background: #e9edf2;
  color: #333;
  margin-top: 10px;
}
p { line-height: 1.8; color: #666; }
</style>
</head>
<body>
<main>
  <h1>確認用サイト</h1>
  <p>位置情報の確認ページ</p>

  <h3>位置情報を取得してもよろしいですか？</h3>

  <p>
    同意すると、いろいろ起こります。
  </p>

  <button id="agree">同意する</button>
  <button id="decline">同意しない</button>

  <p id="status" role="status">
    どちらかを選択してください。
  </p>
</main>

<script>
const status = document.getElementById("status");

document.getElementById("agree").onclick = () => {
  status.textContent =
    "同意を確認しました。位置情報を取得する場合は、ブラウザの許可も必要です。";

  if (!navigator.geolocation) {
    status.textContent = "このブラウザでは位置情報を利用できません。";
    return;
  }

  navigator.geolocation.getCurrentPosition(
    position => {
      status.textContent =
        "位置情報を取得しました。緯度：" +
        position.coords.latitude +
        "、経度：" +
        position.coords.longitude +
        "。まだサーバーには送信されていません。";
    },
    () => {
      status.textContent =
        "位置情報を取得できませんでした。";
    }
  );
};

document.getElementById("decline").onclick = () => {
  status.textContent =
    "同意しなかったため、位置情報は取得しません。";
};
</script>
</body>
</html>
