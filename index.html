
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>確認用サイト</title>
<style>
body {
  margin: 0;
  background: #f5f6f8;
  color: #222;
  font-family: sans-serif;
}
main {
  max-width: 420px;
  margin: 80px auto;
  padding: 30px;
  background: white;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 5px 25px #0001;
}
button {
  width: 100%;
  padding: 15px;
  background: #2878e8;
  color: white;
  border: 0;
  border-radius: 9px;
  font-size: 16px;
}
</style>
</head>
<body>
<main>
<h1>確認用サイト</h1>
<p>位置情報確認ページ</p>
<p>位置情報を送信すると、管理者専用ページで確認できます。</p>
<label>
<input type="checkbox" id="agree">
位置情報の取得と管理者への送信に同意します。
</label>
<br><br>
<button onclick="getLocation()">現在地を確認する</button>
<p id="result">同意した場合のみ取得できます。</p>
</main>
<script>
function getLocation() {
  const result = document.getElementById("result");
  if (!document.getElementById("agree").checked) {
    result.textContent = "先に同意してください。";
    return;
  }
  if (!navigator.geolocation) {
    result.textContent = "位置情報に対応していません。";
    return;
  }
  result.textContent = "位置情報を確認しています...";
  navigator.geolocation.getCurrentPosition(
    p => {
      result.textContent =
        "緯度：" + p.coords.latitude +
        " / 経度：" + p.coords.longitude;
    },
    () => {
      result.textContent = "位置情報を取得できませんでした。";
    }
  );
}
</script>
</body>
</html>
