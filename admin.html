
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理者専用ページ</title>
<style>
body {
  background: #f5f6f8;
  font-family: sans-serif;
  color: #222;
  padding: 20px;
}
main {
  max-width: 420px;
  margin: 70px auto;
  background: white;
  padding: 30px;
  border-radius: 16px;
  text-align: center;
}
input, button {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  box-sizing: border-box;
  border-radius: 8px;
}
input { border: 1px solid #ddd; }
button {
  background: #2878e8;
  color: white;
  border: 0;
  cursor: pointer;
}
</style>
</head>
<body>
<main>
<h1>管理者専用ページ</h1>
<p>管理者のみログインできます。</p>
<input type="email" placeholder="メールアドレス">
<input type="password" placeholder="パスワード">
<button onclick="alert('次の設定でログイン機能を接続します')">
ログイン
</button>
<p>許可された管理者だけが閲覧できます。</p>
</main>
</body>
</html>
