
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理者専用ページ</title>
<style>
body {
  background: #f5f6f8;
  font-family: sans-serif;
  color: #222;
  padding: 20px;
}
main {
  max-width: 500px;
  margin: 60px auto;
  background: white;
  padding: 28px;
  border-radius: 16px;
}
input, button {
  width: 100%;
  box-sizing: border-box;
  padding: 14px;
  margin: 8px 0;
  border-radius: 8px;
}
input { border: 1px solid #ddd; }
button {
  border: 0;
  background: #2878e8;
  color: white;
  cursor: pointer;
}
.hidden { display: none; }
</style>
</head>
<body>
<main>
<section id="login">
<h1>管理者ログイン</h1>
<p>登録したメールアドレスでログインしてください。</p>
<input id="email" type="email" placeholder="メールアドレス">
<input id="password" type="password" placeholder="パスワード">
<button id="loginButton">ログイン</button>
<p id="message" role="status"></p>
</section>

<section id="dashboard" class="hidden">
<h1>管理者ページ</h1>
<p>ログインしました。</p>
<p id="status">管理者権限を確認しています。</p>
<button id="logout">ログアウト</button>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const db = window.supabase.createClient(
  APP_CONFIG.url,
  APP_CONFIG.anonKey
);

const login = document.getElementById("login");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");
const status = document.getElementById("status");

async function checkSession() {
  const { data: { user } } = await db.auth.getUser();

  if (!user) {
    login.classList.remove("hidden");
    dashboard.classList.add("hidden");
    return;
  }

  const { data, error } = await db
    .from("admins")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if (error || !data) {
    await db.auth.signOut();
    message.textContent = "管理者として登録されていません。";
    return;
  }

  login.classList.add("hidden");
  dashboard.classList.remove("hidden");
  status.textContent = "管理者として認証されました。";
}

document.getElementById("loginButton").onclick = async () => {
  message.textContent = "確認中...";

  const { error } = await db.auth.signInWithPassword({
    email: document.getElementById("email").value,
    password: document.getElementById("password").value
  });

  if (error) {
    message.textContent = "ログインできません。入力を確認してください。";
    return;
  }

  await checkSession();
};

document.getElementById("logout").onclick = async () => {
  await db.auth.signOut();
  await checkSession();
};

checkSession();
</script>
</body>
</html>
